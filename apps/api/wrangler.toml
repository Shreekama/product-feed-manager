name = "product-feed-manager-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://product-feed-manager-api.workers.dev"
WEB_URL = "https://product-feed-manager.pages.dev"
MEDIA_BASE_URL = "https://cdn.example.com/media"
MEDIA_MAX_IMAGES = "20"
MEDIA_CACHE_TTL = "21600"

[[d1_databases]]
binding = "DB"
database_name = "shopify-product-feed-db"
database_id = "1f0b3ee3-2b01-4aaf-82fa-69f91648bccd"

[[kv_namespaces]]
binding = "MEDIA_KV"
id = "96826c6a933e4c3d8e6b9b68e4641507"

[[r2_buckets]]
binding = "FEED_R2"
bucket_name = "shopify-product-feed-output"

[[queues.producers]]
binding = "FEED_QUEUE"
queue = "shopify-product-feed-jobs"

[[queues.consumers]]
queue = "shopify-product-feed-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

[triggers]
crons = ["* * * * *"]
