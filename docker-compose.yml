version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pfm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pfm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pfm_secret}
      POSTGRES_DB: ${DB_NAME:-product_feed_manager}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pfm}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pfm_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pfm_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pfm}:${DB_PASSWORD:-pfm_secret}@postgres:5432/${DB_NAME:-product_feed_manager}
      REDIS_URL: redis://redis:6379
    env_file: .env
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: pfm_web
    restart: unless-stopped
    depends_on:
      - api
    env_file: .env
    ports:
      - '3000:3000'

volumes:
  pgdata:
  redisdata:
